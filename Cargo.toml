[package]
name = "blake2b-192"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "BLAKE2b with a fixed 24-byte (192-bit) digest: no_std, zero dependencies, no unsafe"
repository = "https://github.com/AABelkhiria/blake2b-192"
documentation = "https://docs.rs/blake2b-192"
readme = "README.md"
keywords = ["blake2", "blake2b", "hash", "crypto", "no-std"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]
include = [
    "/src",
    "/tests",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/COPYRIGHT",
]

[workspace]
resolver = "3"

[dependencies]
