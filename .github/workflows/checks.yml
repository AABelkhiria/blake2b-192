name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Check all targets
        run: cargo "+${{ matrix.toolchain }}" check --all-targets --locked
      - name: Run tests
        run: cargo "+${{ matrix.toolchain }}" test --locked
      - name: Run tests in release mode
        run: cargo "+${{ matrix.toolchain }}" test --release --locked

  targets:
    name: Target ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain with the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}"
      # The library is no_std with zero dependencies, so every claimed target
      # must compile it as-is.
      - name: Check the library
        run: cargo +stable check --lib --target "${{ matrix.target }}" --locked

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Run the unit tests under Miri
        run: cargo +nightly miri test --locked --lib

  fixtures:
    name: Reproduce oracle fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Re-extract the official KAT vectors
        run: python3 vectors/generate/gen_official_kat.py
      - name: Regenerate the dual-endorsed vectors
        run: python3 vectors/generate/gen_vectors.py
      # Oracle versions in the '#' provenance headers may differ; the vectors must not.
      - name: Committed fixtures must match the regenerated ones
        run: git diff -I'^#' --exit-code -- tests/data

  quality:
    name: Quality and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust with required components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      # The hashing core must stay free of unsafe, panics, and unwraps.
      - name: Reject prohibited paths in the hashing core
        run: |
          if rg -n '\bunsafe[[:space:]]*(\{|fn\b|impl\b|trait\b|extern\b|static\b)|panic!\(|todo!\(|unimplemented!\(|unreachable!\(|\.unwrap\(|\.expect\(' src --glob '!src/tests.rs'; then
            exit 1
          fi
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --locked
      - name: Enforce the dependency policy
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --format-version 1 --locked)

          # A semver prerelease is the "-..." part, which precedes any "+build"
          # part, so strip the build metadata before looking for the hyphen.
          prerelease=$(jq -r '
            .packages[]
            | select(.source != null)
            | select(.version | split("+")[0] | contains("-"))
            | "  \(.name) \(.version)"
          ' <<<"$metadata")

          if [ -n "$prerelease" ]; then
            echo "ERROR: prerelease dependencies in the graph:"
            echo "$prerelease"
            exit 1
          fi

          deps=$(jq -r '[.packages[] | select(.source != null)] | length' <<<"$metadata")
          echo "OK: no prerelease dependencies ($deps in the resolved graph)"
      - name: Prove the hashing core emits no panicking paths
        run: |
          rustup target add thumbv7em-none-eabi
          ./ci/check_no_panics.sh

      # Dependency auditing is dormant while the graph has zero dependencies
      # - name: Install dependency-policy tools
      #   uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
      #   with:
      #     tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      # - name: Check dependency policy
      #   run: cargo deny check
      # - name: Audit Rust dependencies
      #   run: cargo audit
